workflows:
  ios-workflow:
    name: Strivo iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # "appstore_credentials" is a Codemagic environment variable GROUP, not
      # a file in this repo -- create it in the Codemagic dashboard under
      # Teams > Group variables once the Apple Developer Program enrollment
      # (Phase 1) is done. It should hold an App Store Connect API key
      # (Users and Access > Integrations > App Store Connect API in
      # appstoreconnect.apple.com), added to Codemagic under
      # Team settings > Integrations > Apple Developer Portal. Until that
      # key exists, this workflow will fail at the signing step -- that's
      # expected, not a bug in this file.
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: "ai.strivo.app"
        # This project uses Capacitor's Swift Package Manager integration
        # (see ios/App/CapApp-SPM), not CocoaPods -- there is no Podfile and
        # no .xcworkspace, only App.xcodeproj. Build against the project
        # directly; do NOT reintroduce a --workspace flag or a `pod install`
        # step below unless a Podfile is actually added to the repo.
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        # Numeric Apple ID for the Strivo AI app record in App Store
        # Connect (visible in its URL, e.g.
        # appstoreconnect.apple.com/.../apps/6810935174/...) -- NOT the
        # same thing as BUNDLE_ID above. Needed by the "Increment build
        # number" step below to look up the last build number actually
        # accepted by TestFlight.
        APP_STORE_APP_ID: "6810935174"
      xcode: latest
      cocoapods: default
      node: latest
    # Every build runs on a brand-new, disposable machine -- nothing written
    # outside these paths survives between builds. The signing step below
    # generates a private key into $CM_CACHE_DIR/strivo-signing the first
    # time it ever runs and then reuses that exact file on every later
    # build, instead of generating a new one each time. That matters
    # because Apple only lets you download a certificate's private key
    # once, at creation -- a certificate created with build N's key can
    # never be signed with by build N+1's differently-generated key. This
    # is exactly what broke the second real build: it generated a fresh
    # key, but the certificate already sitting on the Apple account was
    # tied to the first build's (already-discarded) key, so nothing matched
    # and code signing silently had nothing to use.
    cache:
      cache_paths:
        - $CM_CACHE_DIR/strivo-signing
    # Names the App Store Connect integration this workflow will use for
    # signing and publishing. "strivo_appstore" doesn't need to exist yet --
    # it's just a label. Once Apple Developer enrollment (Phase 1) is done,
    # create the integration in Codemagic under Team settings > Integrations
    # > Apple Developer Portal, using this exact name, and this workflow
    # will pick it up automatically.
    integrations:
      app_store_connect: strivo_appstore
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install npm dependencies
        script: npm install
      # This app is a "live" wrapper (see capacitor.config.ts's server.url
      # comment) -- there's no static web build to bundle, so this only
      # needs to sync Capacitor's native config/plugins into the already-
      # committed ios/ project, not run `next build`.
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Set up code signing (automatic, via App Store Connect API key)
        script: |
          # This is a brand-new Apple Developer enrollment -- there is no
          # Distribution certificate or App Store provisioning profile for
          # ai.strivo.app anywhere yet, so `xcode-project use-profiles`
          # alone has nothing to find. `fetch-signing-files --create`
          # generates them (via the App Store Connect API key) the first
          # time this runs; later runs will just reuse what already exists.
          keychain initialize
          # `--create` needs a private key to build the certificate signing
          # request it submits to Apple. It has to be the SAME key on every
          # build from here on (see the `cache:` comment above for why) --
          # only generate one if this cache doesn't already have one from a
          # previous build.
          mkdir -p "$CM_CACHE_DIR/strivo-signing"
          CERT_KEY="$CM_CACHE_DIR/strivo-signing/certificate_key.pem"
          if [ ! -f "$CERT_KEY" ]; then
            echo "No cached signing key yet -- generating one."
            openssl genrsa -out "$CERT_KEY" 2048
          else
            echo "Reusing cached signing key from a previous build."
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:"$CERT_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Increment build number
        script: |
          # Apple rejects re-uploading a build number that's already been
          # used for this version, even if the .ipa contents changed --
          # the first successful build shipped as build 1, so a second
          # push with the project still pinned at build 1 fails publishing
          # with "The provided entity includes an attribute with a value
          # that has already been used." Looking up the actual last-used
          # number from TestFlight (rather than hardcoding one here) means
          # this keeps working correctly even after a manual build number
          # change, or a build from another machine.
          BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID")
          BUILD_NUMBER=$((BUILD_NUMBER + 1))
          echo "Setting build number to $BUILD_NUMBER"
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      # Sends every successful build straight to TestFlight (Phase 5) --
      # remove or gate this behind a manual trigger once App Store
      # submissions (Phase 7) start, so a routine push doesn't accidentally
      # ship a build straight to reviewers.
      app_store_connect:
        auth: integration
        submit_to_testflight: true
